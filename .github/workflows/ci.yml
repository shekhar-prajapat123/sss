name: CI

on:
  push:
    branches:
      - main
      - feature/generated-code

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Workflow
        run: echo "GitHub Actions pipeline executed successfully"
